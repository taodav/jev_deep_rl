[project]
name = "jev-deep-rl"
version = "0.1.0"
description = "Evaluate Jev policies in Gymnasium and Atari environments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gymnasium>=1.3.0",
    "httpx2>=2.13.0",
    "numpy>=2.5.3",
    "typesafe-sdk>=0.7.0",
]

[project.optional-dependencies]
atari = [
    "ale-py>=0.12.1",
]
recording = [
    "pillow>=11.3.0",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["runs", ".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
